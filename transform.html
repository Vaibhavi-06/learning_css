<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            flex-wrap: wrap;
            justify-content: center;
            padding: 10px;
            gap: 30px;
        }
        .box{
            background-color: cornflowerblue;
            border: 3px solid black;
            height: 200px;
            width: 200px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transition: transform 5s ease;
        }
        .box1:hover{
            transform: translate(125px,125px);
        }
         .box2:hover{
            transform: translateX(150px);
        }
        .box3:hover{
            transform: translateY(150px);
        }
         .box4:hover{
            transform: Rotate(720deg);
        }
         .box5:hover{
            transform: SkewX(20deg);
        }
         .box6:hover{
            transform: SkewY(20deg);
        }
         .box7:hover{
            transform: Skew(20deg,20deg);
        }
        .box8:hover{
            transform: Scale(1.2);
        }
        .box9:hover{
            transform: scale(3) rotate(90deg) translateX(100px);
        }
        .img-wrapper{
            width: 300px;
            height: 250px;
            border: 2px solid red;
            position: relative;
            overflow: hidden;
        }
        .inner-img{
            width: 100%;
            height: 100%;
            transition: 3s;
        }
        .inner-img:hover{
            transform: scale(1,5);
        }
    </style>
</head>
<body>
   <div class="container">
    <div class="box box1">Translate X & Y</div>
    <div class="box box2">Translate X</div>
    <div class="box box3">Translate Y</div>
    <div class="box box4">Rotate</div>
    <div class="box box5">SkewX</div>
    <div class="box box6">SkewY</div>
    <div class="box box7">Skew</div>
    <div class="box box8">Scale</div>
    <div class="box box9">Multiple</div>
    <div class="box box10"></div>
   </div>
   
   <div class="img-wrapper">
    <img src="Images/flower2.jpg" class="inner-img" alt="flower2">
   </div>
</body>
</html>
