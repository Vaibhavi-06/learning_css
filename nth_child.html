<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul{
            width: 200px;
            padding: 10px;
            list-style: none;
            font-weight: 900;
        }
        li{
            padding: 10px;
            border: 2px solid red;
            border-radius: 10px;
            margin: 10px;
        }
        li:nth-child(odd){
            background-color: aqua;
        }
        li:nth-child(even){
            background-color: blueviolet;
            color: white;
        }
        li:first-child{
            background-color: black;
            color: white;
        }
        li:last-child{
            background-color: green;
            color: white;
        }
        li:nth-child(5){
            background-color: brown;
        }
    </style>
</head>
<body>
    <!-- ul>li*6{Item $} -->
    <ul>
        <li>Items 1</li>
        <li>Items 2</li>
        <li>Items 3</li>
        <li>Items 4</li>
        <li>Items 5</li>
        <li>Items 6</li>
    </ul>
</body>
</html>
